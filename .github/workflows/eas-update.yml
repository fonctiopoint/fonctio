name: EAS Update — Production

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message de mise à jour (optionnel)"
        required: false
        default: "Mise à jour fiches.js"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer EAS CLI
        run: npm install -g eas-cli

      - name: Lancer eas update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --branch production --message "${{ github.event.inputs.message || 'Mise à jour fiches.js' }}" --non-interactive
